name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 単体テスト
        run: npm test
      - name: manifest.json の構文チェック
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: zip を作る
        run: zip -r -q totonoe.zip manifest.json icons src -x '*.test.js'
      - uses: actions/upload-artifact@v4
        with:
          name: totonoe-unpacked
          path: totonoe.zip
